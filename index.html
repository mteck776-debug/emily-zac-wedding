<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emily &amp; Zac · 23 October 2027</title>
<meta name="description" content="Emily and Zac are getting married on 23 October 2027 at Spreyton Cider Co, Tasmania.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="loading">

<div id="demoBanner" class="banner" hidden>Preview mode: RSVPs are only saved on this device until the site is connected.</div>

<header class="nav">
  <a class="nav-mark" href="#top" id="navMark">E <span class="amp">&amp;</span> Z</a>
  <nav aria-label="Sections">
    <a href="#where" data-sec="where" data-t="where.nav">Where</a>
    <a href="#schedule" data-sec="schedule" data-t="schedule.nav">Schedule</a>
    <a href="#stay" data-sec="stay" data-t="stay.nav">Stay</a>
    <a href="#faq" data-sec="faq" data-t="faq.nav">FAQ</a>
    <a class="nav-cta" href="#rsvp" data-t="rsvp.nav">RSVP</a>
  </nav>
</header>

<main id="top">

<section class="hero">
  <div class="hero-inner">
    <p class="eyebrow" data-t="hero.eyebrow">Our greatest adventure yet</p>
    <h1><span data-t="hero.name1">Emily</span> <span class="amp">&amp;</span> <span data-t="hero.name2">Zac</span></h1>
    <p class="hero-date" data-t="hero.date">Saturday 23 October 2027</p>
    <p class="hero-place" data-t="hero.place">Spreyton Cider Co · Tasmania</p>
    <div class="countdown" id="countdown" aria-live="off"></div>
    <a class="btn btn-light" href="#rsvp" data-t="hero.button">RSVP</a>
  </div>
</section>

<section id="where" class="section" data-sec="where">
  <div class="wrap narrow center">
    <p class="eyebrow" data-t="where.eyebrow"></p>
    <h2 data-t="where.title"></h2>
    <p class="lines" data-t="where.text"></p>
    <p class="address lines" data-t="where.address"></p>
    <a class="btn btn-outline" id="mapLink" target="_blank" rel="noopener" href="#" data-t="where.button"></a>
  </div>
</section>

<section id="schedule" class="section tint" data-sec="schedule">
  <div class="wrap narrow">
    <p class="eyebrow center" data-t="schedule.eyebrow"></p>
    <h2 class="center" data-t="schedule.title"></h2>
    <ol class="timeline" id="scheduleList"></ol>
  </div>
</section>

<section id="stay" class="section" data-sec="stay">
  <div class="wrap">
    <p class="eyebrow center" data-t="stay.eyebrow"></p>
    <h2 class="center" data-t="stay.title"></h2>
    <div class="cards" id="stayList"></div>
  </div>
</section>

<section id="faq" class="section tint" data-sec="faq">
  <div class="wrap narrow">
    <p class="eyebrow center" data-t="faq.eyebrow"></p>
    <h2 class="center" data-t="faq.title"></h2>
    <div id="faqList"></div>
  </div>
</section>

<section id="rsvp" class="section">
  <div class="wrap narrow">
    <p class="eyebrow center" data-t="rsvp.eyebrow"></p>
    <h2 class="center" data-t="rsvp.title">RSVP</h2>

    <form id="rsvpForm" novalidate>
      <div id="guests" class="guests"></div>
      <button type="button" id="addGuest" class="btn btn-outline btn-small">+ Add another guest</button>

      <label class="field">
        <span>Email or phone <em>(optional)</em></span>
        <input id="contact" name="contact" maxlength="200" autocomplete="email">
      </label>
      <label class="field">
        <span>Message for the couple <em>(optional)</em></span>
        <textarea id="message" name="message" rows="3" maxlength="1000"></textarea>
      </label>

      <p id="total" class="total" hidden></p>
      <p id="formError" class="error" role="alert" hidden></p>
      <button type="submit" id="send" class="btn btn-solid" data-t="rsvp.button">Send RSVP</button>
      <p class="fine center"><button type="button" id="showPay" class="textbtn">Already replied? Show the bank details again</button></p>
    </form>

    <div id="done" class="done" hidden tabindex="-1">
      <h3 id="doneTitle"></h3>
      <p id="doneText"></p>
      <div id="payBox" class="paybox" hidden>
        <p class="pay-amount" id="payAmount"></p>
        <dl id="payDetails"></dl>
        <p class="fine" id="payRef"></p>
      </div>
      <button type="button" id="again" class="btn btn-outline btn-small">Send another RSVP</button>
    </div>
  </div>
</section>

</main>

<footer class="footer">
  <p class="footer-mark"><span data-t="hero.name1">Emily</span> <span class="amp">&amp;</span> <span data-t="hero.name2">Zac</span></p>
  <p data-t="footer.date">23 . 10 . 2027</p>
</footer>

<template id="guestTpl">
  <fieldset class="guest">
    <legend>Guest</legend>
    <button type="button" class="guest-remove" aria-label="Remove this guest">Remove</button>
    <label class="field">
      <span>Full name</span>
      <input class="g-name" maxlength="80" autocomplete="name" required>
    </label>
    <div class="choice" role="group" aria-label="Attending">
      <label><input type="radio" class="g-yes" value="yes"><span data-t="rsvp.accept">Joyfully accepts</span></label>
      <label><input type="radio" class="g-no" value="no"><span data-t="rsvp.decline">Regretfully declines</span></label>
    </div>
    <div class="g-extra" hidden>
      <label class="check">
        <input type="checkbox" class="g-eat" checked>
        <span data-t="rsvp.food">Having food at the wedding</span>
      </label>
      <label class="field g-diet-wrap">
        <span>Dietary requirements <em>(optional)</em></span>
        <input class="g-diet" maxlength="200" placeholder="e.g. vegetarian, gluten free">
      </label>
    </div>
  </fieldset>
</template>

<script type="module" src="js/site.js?v=7"></script>
</body>
</html>
